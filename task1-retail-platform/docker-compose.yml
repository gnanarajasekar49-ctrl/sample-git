version: '3.8'

services:
  retail-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: retail-app:${APP_VERSION:-4.2.0}
    container_name: retail-app-prod
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - PORT=8081
      - APP_VERSION=${APP_VERSION:-4.2.0}
    networks:
      - retail-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  retail-network:
    name: retail-network
    driver: bridge

