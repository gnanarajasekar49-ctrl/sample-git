version: '3.8'

services:
  customer-db-dev:
    image: postgres:15-alpine
    container_name: customer-db-dev
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_secure_password_123
      POSTGRES_DB: customer_dev_db
    volumes:
      - customer-db-dev-data:/var/lib/postgresql/data
    networks:
      - customer-dev-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d customer_dev_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  customer-app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: customer-app:${VERSION:-5.0.0}
    container_name: customer-app-dev
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
      - ENVIRONMENT=DEV
      - PORT=8081
      - APP_VERSION=${VERSION:-5.0.0}
      - DB_HOST=customer-db-dev
      - DB_PORT=5432
      - DB_USER=dev_user
      - DB_PASSWORD=dev_secure_password_123
      - DB_NAME=customer_dev_db
    depends_on:
      customer-db-dev:
        condition: service_healthy
    networks:
      - customer-dev-net
    restart: unless-stopped

networks:
  customer-dev-net:
    name: customer-dev-net
    driver: bridge

volumes:
  customer-db-dev-data:
    name: customer-db-dev-data

