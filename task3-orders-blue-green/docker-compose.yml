version: '3.8'

services:
  orders-db:
    image: postgres:15-alpine
    container_name: orders-db
    environment:
      POSTGRES_USER: orders_admin
      POSTGRES_PASSWORD: orders_prod_secret_vault
      POSTGRES_DB: orders_db
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    networks:
      - orders-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_admin -d orders_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  orders-blue:
    build:
      context: .
      dockerfile: Dockerfile
    image: orders-api:7.8.0
    container_name: orders-blue
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - PORT=8081
      - APP_VERSION=7.8.0
      - COLOR_SLOT=BLUE
      - DB_HOST=orders-db
      - DB_PORT=5432
      - DB_PASSWORD=orders_prod_secret_vault
    networks:
      - orders-network
    restart: unless-stopped

  orders-green:
    build:
      context: .
      dockerfile: Dockerfile
    image: orders-api:7.9.0
    container_name: orders-green
    ports:
      - "8082:8082"
    environment:
      - NODE_ENV=production
      - PORT=8082
      - APP_VERSION=7.9.0
      - COLOR_SLOT=GREEN
      - DB_HOST=orders-db
      - DB_PORT=5432
      - DB_PASSWORD=orders_prod_secret_vault
    networks:
      - orders-network
    restart: unless-stopped

  orders-proxy:
    image: nginx:alpine
    container_name: orders-proxy
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - orders-network
    depends_on:
      - orders-blue
    restart: unless-stopped

networks:
  orders-network:
    name: orders-network
    driver: bridge

volumes:
  orders-db-data:
    name: orders-db-data

